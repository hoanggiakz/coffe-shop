version: '3.8'

services:
  table-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: table_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - '5435:5432'
    volumes:
      - table_db_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper-table
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-table:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka-table
    container_name: kafka-table
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKERS: PLAINTEXT://localhost:9093
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  table-service:
    build: .
    restart: always
    ports:
      - "3003:3003"
    depends_on:
      - table-db
      - kafka-table
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  table_db_data:

