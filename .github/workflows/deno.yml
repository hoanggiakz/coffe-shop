name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-build-and-test:
    name: Node Build/Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/backend/api-gateway
          - apps/backend/order-service
          - apps/backend/chat-service
          - apps/backend/inventory-service
          - apps/backend/payment-service
          - apps/backend/report-service
          - apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint (if script exists)
        working-directory: ${{ matrix.service }}
        run: |
          if npm run | grep -qE "^[[:space:]]+lint"; then
            npm run lint
          else
            echo "No lint script for ${{ matrix.service }}, skipping."
          fi

      - name: Type check (if script exists)
        working-directory: ${{ matrix.service }}
        run: |
          if npm run | grep -qE "^[[:space:]]+typecheck"; then
            npm run typecheck
          else
            echo "No typecheck script for ${{ matrix.service }}, skipping."
          fi

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Unit test
        working-directory: ${{ matrix.service }}
        run: |
          if npm run | grep -qE "^[[:space:]]+test"; then
            npm test -- --runInBand --passWithNoTests
          else
            echo "No test script for ${{ matrix.service }}, skipping."
          fi

  java-build-and-test:
    name: Java Build/Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/backend/user-service
          - apps/backend/table-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Gradle wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x ./gradlew

      - name: Run Gradle checks
        working-directory: ${{ matrix.service }}
        run: ./gradlew --no-daemon clean build

  compose-validate:
    name: Compose Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config -q

  deploy:
    name: Deploy (main only)
    runs-on: ubuntu-latest
    needs:
      - node-build-and-test
      - java-build-and-test
      - compose-validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check deploy secrets
        id: deploy_guard
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && \
             [ -n "${{ secrets.DEPLOY_USER }}" ] && \
             [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] && \
             [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are missing. Skip deploy."
          fi

      - name: Deploy via SSH
        if: steps.deploy_guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --all
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build
