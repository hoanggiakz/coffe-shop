version: '3.8'

services:
  menu-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - '5436:5432'
    volumes:
      - menu_db_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper-menu
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-menu:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka-menu
    container_name: kafka-menu
    depends_on:
      - zookeeper
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKERS: PLAINTEXT://localhost:9094
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6380:6379'
    command: redis-server --requirepass redis123

  menu-service:
    build: .
    restart: always
    ports:
      - "3004:3004"
    depends_on:
      - menu-db
      - kafka-menu
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  menu_db_data:
