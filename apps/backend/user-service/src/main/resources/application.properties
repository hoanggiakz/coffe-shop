server.port=${SERVER_PORT:3000}
server.error.include-message=always
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secretpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cross-service validation before deleting branch
app.table-service-url=${TABLE_SERVICE_URL:http://table-service:3003}
app.order-service-url=${ORDER_SERVICE_URL:http://order-service:3001}
app.inventory-service-url=${INVENTORY_SERVICE_URL:http://inventory-service:3005}
app.internal-service-token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}
app.google-oauth-client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.google-oauth-client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.google-oauth-callback-url=${GOOGLE_OAUTH_CALLBACK_URL:https://app.httpscoffee-demo.buzz/api/auth/google/callback}
