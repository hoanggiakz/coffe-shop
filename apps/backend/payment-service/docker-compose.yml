version: '3.8'

services:
  payment-db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - '5436:5432'
    volumes:
      - payment_db_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper-payment
    ports:
      - "2185:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-payment:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka-payment
    container_name: kafka-payment
    depends_on:
      - zookeeper
    ports:
      - "9096:9092"
    environment:
      KAFKA_BROKERS: PLAINTEXT://localhost:9096
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9096
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  payment-service:
    build: .
    restart: always
    ports:
      - "3004:3004"
    depends_on:
      - payment-db
      - kafka-payment
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  payment_db_data:
