version: '3.8'

services:
  chat-service:
    build: .
    ports:
      - '3007:3007'
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@db:5432/chatdb?schema=public
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://host.docker.internal:3001}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes

volumes:
  postgres_data:
