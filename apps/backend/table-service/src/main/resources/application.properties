server.port=${SERVER_PORT:3003}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tabledb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secretpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App
app.base-url=${APP_BASE_URL:http://127.0.0.1:8088}
app.chat-service-url=${APP_CHAT_SERVICE_URL:http://chat-service:3007/api/chats}
app.order-service-url=${APP_ORDER_SERVICE_URL:http://order-service:3001/api/orders}
app.seed-tables-on-startup=${SEED_TABLES_ON_STARTUP:true}
