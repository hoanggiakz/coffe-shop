services:
  # ── Databases ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

  # ── API Gateway (Node.js / NestJS) ────────────────────────
  api-gateway:
    build: ./apps/backend/api-gateway
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-service:3000
      TABLE_SERVICE_URL: http://table-service:3003
      ORDER_SERVICE_URL: http://order-service:3001
      CHAT_SERVICE_URL: http://chat-service:3007
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3004
      REPORT_SERVICE_URL: http://report-service:3006
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      table-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  # ── User Service (Spring Boot) ────────────────────────────
  user-service:
    build: ./apps/backend/user-service
    expose:
      - "3000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/users/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - backend
    restart: unless-stopped

  # ── Table Service (Spring Boot) ───────────────────────────
  table-service:
    build: ./apps/backend/table-service
    expose:
      - "3003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tabledb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${TABLE_DB_PASSWORD}
      SERVER_PORT: 3003
      APP_BASE_URL: ${APP_BASE_URL:-https://coffee.example.com}
      APP_CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      APP_ORDER_SERVICE_URL: http://order-service:3001/api/orders
    depends_on:
      postgres:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/tables/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - backend
    restart: unless-stopped

  # ── Order Service (Node.js / NestJS) ──────────────────────
  order-service:
    build: ./apps/backend/order-service
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && node dist/src/main.js"
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${ORDER_DATABASE_URL}
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      USER_SERVICE_URL: http://user-service:3000
      CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      TABLE_SERVICE_URL: http://table-service:3003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/orders/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - backend
    restart: unless-stopped

  # ── Chat Service (Node.js / NestJS + Socket.io) ──────────
  chat-service:
    build: ./apps/backend/chat-service
    command: sh -c "npx prisma db push && node dist/main"
    expose:
      - "3007"
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: ${CHAT_DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/api/chats/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  # ── Inventory Service (Node.js / NestJS) ─────────────────
  inventory-service:
    build: ./apps/backend/inventory-service
    command: sh -c "npx prisma db push && node dist/src/main.js"
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
      KAFKA_BROKERS: ""
      CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      LOW_STOCK_ALERT_EMAILS: manager@coffeeshop.com
      SMTP_HOST: smtp.your-provider.com
      SMTP_PORT: 587
      SMTP_USER: noreply@coffee.example.com
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: "\"Coffee Shop\" <noreply@coffee.example.com>"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/api/v1/ingredients/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  # ── Payment Service (Node.js / NestJS) ───────────────────
  payment-service:
    build: ./apps/backend/payment-service
    command: sh -c "npx prisma db push && node dist/src/main.js"
    expose:
      - "3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      KAFKA_BROKERS: ""
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-https://coffee.example.com/payment/return}
    depends_on:
      postgres:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/api/v1/payments/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  # ── Report Service (Node.js / NestJS) ───────────────────
  report-service:
    build: ./apps/backend/report-service
    command: sh -c "npx prisma db push && node dist/src/main.js"
    expose:
      - "3006"
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: ${REPORT_DATABASE_URL}
      ORDER_DATABASE_URL: ${ORDER_DATABASE_URL}
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL}
      PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL}
      USER_DATABASE_URL: ${REPORT_USER_DATABASE_URL}
      KAFKA_BROKERS: ""
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/api/reports/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  # ── Frontend (Vite + Nginx) ────────────────────────────────
  frontend:
    build: ./apps/frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api-gateway:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - backend
    restart: unless-stopped

  # ── Daily PostgreSQL Backup Job ───────────────────────────
  db-backup:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 7
    command: >
      sh -c "
      mkdir -p /backups &&
      while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dumpall -h postgres -U postgres > /backups/backup-$$ts.sql &&
        find /backups -type f -name 'backup-*.sql' -mtime +$$BACKUP_RETENTION_DAYS -delete;
        sleep $$BACKUP_INTERVAL_SECONDS;
      done"
    volumes:
      - ./backups:/backups
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge

