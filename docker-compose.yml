services:
  # Core infrastructure
  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped

  api-gateway:
    build: ./apps/backend/api-gateway
    expose:
      - "8080"
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${API_GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      REDIS_URL: redis://redis:6379
      USER_SERVICE_URL: http://user-service:3000
      TABLE_SERVICE_URL: http://table-service:3003
      ORDER_SERVICE_URL: http://order-service:3001
      CHAT_SERVICE_URL: http://chat-service:3007
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3004
      REPORT_SERVICE_URL: http://report-service:3006
      AI_SERVICE_URL: http://ai-service:3010
      MENU_QR_ALLOW_BRANCH_ONLY_TEST: ${MENU_QR_ALLOW_BRANCH_ONLY_TEST:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://coffee.example.com}
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      table-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

  user-service:
    build: ./apps/backend/user-service
    expose:
      - "3000"
    environment:
      SPRING_DATASOURCE_URL: ${USER_DB_URL:-jdbc:postgresql://postgres:5432/userdb}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 3000
      TABLE_SERVICE_URL: http://table-service:3003
      ORDER_SERVICE_URL: http://order-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      SPRING_DATA_REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-https://app.httpscoffee-demo.buzz/api/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/users/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - backend
    restart: unless-stopped

  table-service:
    build: ./apps/backend/table-service
    expose:
      - "3003"
    environment:
      SPRING_DATASOURCE_URL: ${TABLE_DB_URL:-jdbc:postgresql://postgres:5432/tabledb}
      SPRING_DATASOURCE_USERNAME: ${TABLE_DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${TABLE_DB_PASSWORD:-postgres}
      SERVER_PORT: 3003
      APP_BASE_URL: ${APP_BASE_URL:-https://coffee.example.com}
      APP_CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      APP_ORDER_SERVICE_URL: http://order-service:3001/api/orders
      SEED_TABLES_ON_STARTUP: ${SEED_TABLES_ON_STARTUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/tables/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - backend
    restart: unless-stopped

  order-service:
    build: ./apps/backend/order-service
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && node dist/src/main.js"
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: ${ORDER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/orderdb?schema=public}
      KAFKA_REQUIRED: ${ORDER_KAFKA_REQUIRED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      USER_SERVICE_URL: http://user-service:3000
      CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      TABLE_SERVICE_URL: http://table-service:3003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/orders/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - backend
    restart: unless-stopped

  chat-service:
    build: ./apps/backend/chat-service
    command: sh -c "npx prisma db push --accept-data-loss && node dist/main"
    expose:
      - "3007"
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${CHAT_SERVICE_HOST_PORT:-3007}:3007"
    environment:
      NODE_ENV: ${CHAT_NODE_ENV:-production}
      PORT: 3007
      DATABASE_URL: ${CHAT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/chatdb?schema=public}
      REDIS_URL: redis://redis:6379
      SOCKET_IO_REDIS_ADAPTER: ${SOCKET_IO_REDIS_ADAPTER:-true}
      KAFKA_REQUIRED: ${CHAT_KAFKA_REQUIRED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3007/api/chats/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  inventory-service:
    build: ./apps/backend/inventory-service
    command: sh -c "npx prisma db push && npx prisma db seed && node dist/src/main.js"
    expose:
      - "3005"
    environment:
      NODE_ENV: ${INVENTORY_NODE_ENV:-development}
      PORT: 3005
      DATABASE_URL: ${INVENTORY_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/inventorydb?schema=public}
      KAFKA_REQUIRED: ${INVENTORY_KAFKA_REQUIRED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      LOW_STOCK_ALERT_EMAILS: ${LOW_STOCK_ALERT_EMAILS:-manager@coffeeshop.com}
      SMTP_HOST: ${SMTP_HOST:-smtp.your-provider.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@coffee.example.com}
      SMTP_PASS: ${SMTP_PASS:-change-this-smtp-password}
      SMTP_FROM: "${SMTP_FROM:-Coffee Shop <noreply@coffee.example.com>}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/api/v1/ingredients/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  payment-service:
    build: ./apps/backend/payment-service
    command: sh -c "npx prisma db push && node dist/src/main.js"
    expose:
      - "3004"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3004
      DATABASE_URL: ${PAYMENT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/paymentdb?schema=public}
      KAFKA_REQUIRED: ${PAYMENT_KAFKA_REQUIRED:-false}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      CHAT_SERVICE_URL: http://chat-service:3007/api/chats
      ORDER_SERVICE_URL: http://order-service:3001
      APP_BASE_URL: ${APP_BASE_URL:-https://coffee.example.com}
      ONLINE_PAYMENT_QR_URL: ${ONLINE_PAYMENT_QR_URL:-https://img.vietqr.io/image/VCB-1026422235-qr_only.png}
      ONLINE_PAYMENT_QR_ACCOUNT_NAME: ${ONLINE_PAYMENT_QR_ACCOUNT_NAME:-Coffee Shop}
      ONLINE_PAYMENT_QR_ACCOUNT_NO: ${ONLINE_PAYMENT_QR_ACCOUNT_NO:-1026422235}
      ONLINE_PAYMENT_QR_BANK_CODE: ${ONLINE_PAYMENT_QR_BANK_CODE:-VCB}
      ONLINE_PAYMENT_QR_BANK_NAME: ${ONLINE_PAYMENT_QR_BANK_NAME:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-}
      VIETQR_QUERY_URL: ${VIETQR_QUERY_URL:-}
      SEPAY_QUERY_URL: ${SEPAY_QUERY_URL:-}
      SEPAY_ENV: ${SEPAY_ENV:-production}
      SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      ONLINE_PAYMENT_TIMEOUT_MINUTES: ${ONLINE_PAYMENT_TIMEOUT_MINUTES:-30}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      VNPAY_WEBHOOK_SECRET: ${VNPAY_WEBHOOK_SECRET:-}
      VIETQR_WEBHOOK_SECRET: ${VIETQR_WEBHOOK_SECRET:-}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_IPN_API_KEY: ${SEPAY_IPN_API_KEY:-}
      SEPAY_IPN_AUTH_TYPE: ${SEPAY_IPN_AUTH_TYPE:-either}
      SEPAY_RELAY_SHARED_SECRET: ${SEPAY_RELAY_SHARED_SECRET:-}
      SEPAY_RELAY_BUFFER_SIZE: ${SEPAY_RELAY_BUFFER_SIZE:-1000}
      SEPAY_RELAY_PULL_ENABLED: ${SEPAY_RELAY_PULL_ENABLED:-false}
      SEPAY_RELAY_SOURCE_URL: ${SEPAY_RELAY_SOURCE_URL:-}
      SEPAY_RELAY_PULL_INTERVAL_MS: ${SEPAY_RELAY_PULL_INTERVAL_MS:-3000}
      SEPAY_RELAY_CONSUMER_ID: ${SEPAY_RELAY_CONSUMER_ID:-local-dev}
    depends_on:
      postgres:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/api/v1/payments/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  report-service:
    build: ./apps/backend/report-service
    command: sh -c "npx prisma db push && node dist/src/main.js"
    expose:
      - "3006"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3006
      DATABASE_URL: ${REPORT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/reportdb?schema=public}
      ORDER_DATABASE_URL: ${ORDER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/orderdb?schema=public}
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/inventorydb?schema=public}
      PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/paymentdb?schema=public}
      USER_DATABASE_URL: ${REPORT_USER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/userdb?schema=public}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3006/api/reports/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s
    networks:
      - backend
    restart: unless-stopped

  frontend:
    build: ./apps/frontend
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8088}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - backend
    restart: unless-stopped

  ai-service:
    build: ./apps/backend/ai-service
    expose:
      - "3010"
    environment:
      REPORT_DATABASE_URL: ${REPORT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/reportdb?schema=public}
      AI_MODEL_REGISTRY_URL: ${AI_MODEL_REGISTRY_URL:-http://mlflow:5000}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-openai}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_CHATBOT_SQL_TIMEOUT_MS: ${AI_CHATBOT_SQL_TIMEOUT_MS:-2000}
      AI_CHATBOT_MAX_ROWS: ${AI_CHATBOT_MAX_ROWS:-200}
      AI_ROLLOUT_PERCENT: ${AI_ROLLOUT_PERCENT:-10}
      AI_ACTIVE_MODEL_VERSION: ${AI_ACTIVE_MODEL_VERSION:-baseline_v1}
      AI_STAGING_MODEL_VERSION: ${AI_STAGING_MODEL_VERSION:-baseline_v2_candidate}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3010/api/ai/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - backend
    restart: unless-stopped

  db-backup:
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    command: >
      sh -c "
      mkdir -p /backups &&
      while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dumpall -h postgres -U postgres > /backups/backup-$$ts.sql &&
        find /backups -type f -name 'backup-*.sql' -mtime +$$BACKUP_RETENTION_DAYS -delete;
        sleep $$BACKUP_INTERVAL_SECONDS;
      done"
    volumes:
      - ./backups:/backups
    networks:
      - backend
    restart: unless-stopped

  # Optional stack: monitoring
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    container_name: coffee-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - backend
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    container_name: coffee-grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3008}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend
    restart: unless-stopped

  # Optional stack: centralized logging (ELK)
  elasticsearch:
    profiles: ["logging"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: coffee-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - backend
    restart: unless-stopped

  logstash:
    profiles: ["logging"]
    image: docker.elastic.co/logstash/logstash:8.14.3
    container_name: coffee-logstash
    depends_on:
      - elasticsearch
    ports:
      - "${LOGSTASH_BEATS_HOST_PORT:-5044}:5044"
      - "${LOGSTASH_TCP_HOST_PORT:-5000}:5000"
    volumes:
      - ./logging/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - backend
    restart: unless-stopped

  kibana:
    profiles: ["logging"]
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: coffee-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    networks:
      - backend
    restart: unless-stopped

  # Optional stack: AI platform
  kafka-zookeeper:
    profiles: ["ai"]
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - backend
    restart: unless-stopped

  kafka:
    profiles: ["ai"]
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - kafka-zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kafka-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - backend
    restart: unless-stopped

  kafka-connect:
    profiles: ["ai"]
    image: debezium/connect:2.7.3.Final
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - backend
    restart: unless-stopped

  timescaledb:
    profiles: ["ai"]
    image: timescale/timescaledb:2.15.3-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: aiwarehouse
    ports:
      - "55433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  clickhouse:
    profiles: ["ai"]
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - backend
    restart: unless-stopped

  feast-feature-server:
    profiles: ["ai"]
    image: feastdev/feature-server:latest
    command: ["feast", "serve", "--host", "0.0.0.0", "--port", "6566"]
    ports:
      - "6566:6566"
    volumes:
      - ./ops/feast:/feast
    working_dir: /feast
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  airflow:
    profiles: ["ai"]
    image: apache/airflow:2.9.3
    command: standalone
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
    volumes:
      - airflow_home:/opt/airflow
      - ./ops/airflow/dags:/opt/airflow/dags
    ports:
      - "8089:8080"
    networks:
      - backend
    restart: unless-stopped

  mlflow:
    profiles: ["ai"]
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  elastic_data:
  airflow_home:
  mlflow_data:
  timescaledb_data:
  clickhouse_data:

networks:
  backend:
    driver: bridge

