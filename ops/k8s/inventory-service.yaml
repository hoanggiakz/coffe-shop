apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: your-registry/coffee-inventory-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: coffee-config
          env:
            - name: PORT
              value: "3005"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/inventorydb?schema=public
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: INTERNAL_SERVICE_TOKEN
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: SMTP_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 3005
      targetPort: 3005
