apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: your-registry/coffee-payment-service:latest
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: coffee-config
          env:
            - name: PORT
              value: "3004"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/paymentdb?schema=public
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: JWT_SECRET
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: INTERNAL_SERVICE_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 3004
      targetPort: 3004
