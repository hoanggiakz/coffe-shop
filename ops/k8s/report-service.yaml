apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
        - name: report-service
          image: your-registry/coffee-report-service:latest
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: coffee-config
          env:
            - name: PORT
              value: "3006"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/reportdb?schema=public
            - name: ORDER_DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/orderdb?schema=public
            - name: INVENTORY_DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/inventorydb?schema=public
            - name: PAYMENT_DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/paymentdb?schema=public
            - name: USER_DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/userdb?schema=public
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: coffee-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
spec:
  selector:
    app: report-service
  ports:
    - port: 3006
      targetPort: 3006
